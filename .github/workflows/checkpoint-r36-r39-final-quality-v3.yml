name: Round 36-39 Final Quality v3

on:
  push:
    branches:
      - checkpoint/2026-09-15-r36-r39-final-quality-v3

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
