name: Pending Source Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/adapters/pending-*.mjs"
      - "scripts/adapters/*-source.mjs"
      - "scripts/parsers/*.mjs"
      - "scripts/*-smoke.mjs"
      - "scripts/pending-*.mjs"
      - "scripts/run-pending-*.mjs"
      - "scripts/report-pending-sources.mjs"
      - "scripts/audit-pending-source-collisions.mjs"
      - ".github/workflows/pending-source-check.yml"

permissions:
  contents: read

jobs:
  pending-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run pending runtime smokes
        run: node scripts/run-pending-source-smokes.mjs

      - name: Run pending preflight and collision audit
        env:
          PENDING_INGEST_PREFLIGHT_ONLY: "1"
        run: node scripts/run-pending-ingest-checked.mjs
