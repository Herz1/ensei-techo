name: Venue Baseline Cleanup

on:
  push:
    branches:
      - checkpoint/2026-09-15-venue-baseline-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'ci: run venue baseline cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize ingested venues
        run: node scripts/publish-venues.mjs
      - name: Commit normalized venue baseline
        run: |
          if git diff --quiet -- src/data/venues-ingested.json; then
            echo "No venue baseline changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/venues-ingested.json
          git commit -m "chore: normalize ingested venue baseline"
          git push origin HEAD:checkpoint/2026-09-15-venue-baseline-cleanup
